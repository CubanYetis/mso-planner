name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres so the DB-backed tests in internal/db run
      # (they skip when MSO_TEST_DSN is unset). Same throwaway credentials
      # as docker-compose.yaml.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mso_test
          POSTGRES_USER: mso
          POSTGRES_PASSWORD: msopassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mso -d mso_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # -p 1: packages run serially because each migrates the schema on
      # connect, and concurrent CREATE TABLE IF NOT EXISTS races inside
      # Postgres (duplicate pg_type entry).
      - name: test
        run: go test -p 1 ./...
        env:
          MSO_TEST_DSN: postgres://mso:msopassword@localhost:5432/mso_test?sslmode=disable

  images:
    # Publish only from main; PRs run the test job and nothing else.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # ghcr.io requires lowercase image names; the repo owner may not be.
      - name: Lowercase registry owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mso-planner-web:latest
            ghcr.io/${{ env.OWNER_LC }}/mso-planner-web:${{ github.sha }}
      - name: Build and push scraper image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scraper
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mso-planner-scraper:latest
            ghcr.io/${{ env.OWNER_LC }}/mso-planner-scraper:${{ github.sha }}
